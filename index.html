/* Layout: green header band with brand and a four-tab row, then one centered column of cards.
   Colors are tokens; every text/background pair is at least 4.5:1, every control edge at least 3:1. */
:root{
  --bg:#F6F5EF; --surface:#FFFFFF; --ink:#1C1C1A; --ink2:#4B4B45; --edge:#6B6B64; --hair:#D8D6CC;
  --band:#2F5E1B; --bandInk:#FFFFFF;
  --primary:#2F5E1B; --primaryInk:#FFFFFF; --primaryHover:#244A14; --tint:#E4EDD6;
  --mari:#A34A06; --err:#B3261E; --focus:#1B4FD0;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12150F; --surface:#1C2117; --ink:#F0EFE8; --ink2:#C4C3B8; --edge:#9A9A8F; --hair:#3A4033;
    --band:#22381A; --bandInk:#EAF3E0;
    --primary:#8CCB63; --primaryInk:#0E1A08; --primaryHover:#A5DB82; --tint:#2A3A1F;
    --mari:#F2B450; --err:#FF9A90; --focus:#A8C8FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12150F; --surface:#1C2117; --ink:#F0EFE8; --ink2:#C4C3B8; --edge:#9A9A8F; --hair:#3A4033;
  --band:#22381A; --bandInk:#EAF3E0;
  --primary:#8CCB63; --primaryInk:#0E1A08; --primaryHover:#A5DB82; --tint:#2A3A1F;
  --mari:#F2B450; --err:#FF9A90; --focus:#A8C8FF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.55;overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.9rem}
h2{font-size:1.35rem}
h3{font-size:1.15rem}
p{margin:0}
.wrap{max-width:42rem;margin-inline:auto;padding-inline:16px}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:16px;top:-5rem;background:var(--surface);color:var(--ink);border:2px solid var(--ink);padding:12px 16px;border-radius:8px;font-weight:700;z-index:10}
.skip:focus{top:8px}

/* header */
.band{background:var(--band);color:var(--bandInk)}
.band .wrap{display:flex;align-items:center;justify-content:center;gap:14px;padding-block:14px}
.mark{width:48px;height:48px;flex:none}
.mark circle,.mark ellipse{fill:var(--bandInk)}
.mark .eye{fill:var(--band)}
.mark .pupil{fill:var(--bandInk)}
.mark .smile{fill:none;stroke:var(--band);stroke-width:3;stroke-linecap:round}
.scene{display:flex;align-items:flex-end;gap:0;flex:none}
.logo{display:block;height:60px;width:auto;flex:none}
.toad{display:block;width:52px;height:45px;flex:none;align-self:flex-end}
.band:not(.has-logo) .toad{display:none}
.band.eaten .toad-body{display:none}
.brand-text{min-width:0;text-align:center}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.time-input{max-width:12rem}
a.btn{text-decoration:none}
.hero{padding:24px 22px}
.hero > *+*{margin-top:20px}
.hero-date{font-family:var(--body);font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.strip{list-style:none;margin:0;padding:16px 0 0;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.95rem;color:var(--ink2)}
.strip li{display:flex;align-items:center;gap:6px}
.strip strong{color:var(--ink)}
.strip .flame{color:var(--mari);display:flex}
.strip svg{width:20px;height:20px}
.hero .frog-text{margin-top:6px;line-height:1.25}
.frog-label{font-family:var(--body);font-size:1rem;font-weight:700;letter-spacing:.02em;color:var(--ink2)}
.band.has-logo{--band:#000000;--bandInk:#FFFFFF}
.band.has-logo .wrap{padding-block:8px}
.band.has-logo .mark{display:none}
.brand-name{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.1}
.brand-org{font-size:.95rem;margin-top:2px}
.tabs{background:var(--surface);border-bottom:1px solid var(--hair)}
.tabs ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
.tab{width:100%;min-height:52px;padding:6px 2px;background:transparent;color:var(--ink);border:0;border-bottom:5px solid transparent;font:inherit;font-size:1rem;font-weight:400;cursor:pointer}
.tab[aria-current="page"]{border-bottom-color:var(--primary);font-weight:700}
.tab:hover{background:var(--tint)}
.tab:focus-visible{outline-offset:-3px}

main{display:block;padding-block:24px 40px}
main > *+*,#app > *+*{margin-top:20px}
.lede{color:var(--ink2)}
.status{border-left:4px solid var(--primary);background:var(--tint);border-radius:6px;padding:8px 12px;font-size:.95rem}
.status:empty{display:none}
.notice{border:2px solid var(--err);border-radius:10px;padding:12px 16px;background:var(--surface)}

/* cards */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:20px}
.card > *+*{margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:14px;margin:0}
.stats div{margin:0}
.stats dt{font-size:.95rem;color:var(--ink2)}
.stats dd{margin:0;font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.15;display:flex;align-items:center;gap:8px}
.stats .flame{color:var(--mari);display:flex}
.stats svg{width:28px;height:28px;flex:none}
.frog-text{font-family:var(--display);font-weight:700;font-size:1.4rem;line-height:1.3}

/* forms */
form > *+*{margin-top:20px}
.field{display:grid;gap:6px}
label,legend{font-weight:700}
.hint{color:var(--ink2);font-size:.95rem}
.input{width:100%;min-height:52px;padding:10px 14px;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:2px solid var(--edge);border-radius:10px}
textarea.input{min-height:7rem;resize:vertical}
.input[aria-invalid="true"]{border-color:var(--err);border-width:3px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0}
legend{padding:0;margin-bottom:2px}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border:2px solid var(--edge);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:400}
.opt:has(input:checked){background:var(--tint);border-color:var(--primary);border-width:3px;padding:9px 13px;font-weight:700}
.opt input{width:26px;height:26px;margin:0;flex:none;accent-color:var(--primary)}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:3px}
.err{color:var(--err);font-weight:700}
.err:empty{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:10px;border:2px solid var(--primary);background:var(--primary);color:var(--primaryInk);font:inherit;font-weight:700;cursor:pointer}
.btn:hover{background:var(--primaryHover);border-color:var(--primaryHover)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--edge)}
.btn.alt:hover{background:var(--tint)}
.btn.danger{background:transparent;color:var(--err);border-color:var(--err)}
.btn.small{min-height:48px;padding:0 20px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.saved{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--ink)}
.saved svg{width:24px;height:24px;flex:none;color:var(--primary)}

/* journal */
.entries{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.entry > *+*{margin-top:10px}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 20px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.95rem;font-weight:700;color:var(--ink)}
.chip svg{width:18px;height:18px;flex:none}
.chip.good svg{color:var(--primary)}
.chip.warn svg{color:var(--mari)}
.hero > .chips{margin-top:14px}
.hero > .strip{margin-top:24px}
.nudge{border-color:var(--mari);border-width:2px}
.done-msg{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.3;color:var(--ink)}
.entry-date{font-family:var(--body);font-size:.95rem;font-weight:700;color:var(--ink2)}
.entry-frog{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.3}
.entry{padding:16px 18px}
.note{white-space:pre-wrap;padding:12px 14px;border-left:4px solid var(--hair);background:var(--bg);border-radius:6px}

/* badges */
.badges{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:14px}
.badge{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.card.badge > *+*{margin-top:0}
.badge h2{font-size:1.15rem}
.badge .state{font-weight:700}
.badge.locked{border-style:dashed;border-color:var(--edge)}
.medal{width:64px;height:72px}
.medal .ribbon{fill:var(--mari)}
.medal .disc{fill:var(--primary)}
.medal .glyph{fill:var(--primaryInk);font-family:var(--display);font-weight:700;font-size:24px}
.medal .line{stroke:var(--primaryInk);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.medal.off .ribbon{display:none}
.medal.off .disc{fill:none;stroke:var(--edge);stroke-width:3;stroke-dasharray:5 5}
.medal.off .glyph{fill:var(--ink2)}
.medal.off .line{stroke:var(--ink2)}
progress{width:100%;height:14px;accent-color:var(--primary);margin-top:6px}

/* help */
.steps{margin:0;padding-left:1.4rem;display:grid;gap:8px}
.backup{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
footer{padding-block:20px 32px;color:var(--ink2);font-size:.95rem;border-top:1px solid var(--hair)}

@media (max-width:420px){
  h1{font-size:1.6rem}
  .brand-name{font-size:1.3rem}
  .tab{font-size:.9rem}
  .card{padding:16px}
}
@media (prefers-reduced-motion: no-preference){
  .tab,.btn,.opt{transition:background-color .15s ease}
}
</style>

/* ---------- Storage (this device only) ---------- */
var KEY = 'eat-the-frog:v1';
var MAX_FROG = 120, MAX_NOTE = 500;
var PROGRESS = { none: 'None yet', some: 'Some progress', done: 'Finished' };
var storageOk = true;
var memoryStore = null;

function probeStorage(){
  try { localStorage.setItem(KEY + ':probe', '1'); localStorage.removeItem(KEY + ':probe'); return true; }
  catch (e) { return false; }
}
function isDateKey(k){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return false;
  var p = k.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]);
  return d.getFullYear() === p[0] && d.getMonth() === p[1] - 1 && d.getDate() === p[2];
}
function cleanEntry(key, e){
  if (!isDateKey(key) || !e || typeof e !== 'object') return null;
  var frog = typeof e.frog === 'string' ? e.frog.trim().slice(0, MAX_FROG) : '';
  if (!frog) return null;
  return {
    date: key,
    frog: frog,
    prioritized: e.prioritized === true ? true : e.prioritized === false ? false : null,
    progress: (e.progress === 'none' || e.progress === 'some' || e.progress === 'done') ? e.progress : null,
    note: typeof e.note === 'string' ? e.note.slice(0, MAX_NOTE) : '',
    updated: typeof e.updated === 'number' ? e.updated : 0
  };
}
function cleanAll(obj){
  var out = {};
  if (!obj || typeof obj !== 'object') return out;
  Object.keys(obj).forEach(function(k){ var c = cleanEntry(k, obj[k]); if (c) out[k] = c; });
  return out;
}
function load(){
  storageOk = probeStorage();
  if (!storageOk) return {};
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return {};
    return cleanAll(JSON.parse(raw).entries);
  } catch (e) { return {}; }
}
function save(){
  if (!storageOk) return false;
  try { localStorage.setItem(KEY, JSON.stringify({ version: 1, entries: entries })); return true; }
  catch (e) { storageOk = false; return false; }
}

/* ---------- Dates ---------- */
function pad(n){ return String(n).padStart(2, '0'); }
function keyOf(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayKey(){ return keyOf(new Date()); }
function fromKey(k){ var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function dayNum(k){ var p = k.split('-').map(Number); return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); }
function fmtDate(k){
  var d = fromKey(k), o = { weekday: 'long', month: 'long', day: 'numeric' };
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
function pl(n, w){ return n + ' ' + w + (n === 1 ? '' : 's'); }

/* ---------- State ---------- */
var entries = load();
var state = { view: 'today', editDate: null, editingFrog: false, confirmDelete: null, checkinOpen: false };
var renderedDay = todayKey();

function isChecked(e){ return e.prioritized !== null && e.progress !== null; }

function computeStats(){
  var t = dayNum(todayKey()), list = Object.keys(entries).map(function(k){ return entries[k]; });
  var firsts = {};
  list.forEach(function(e){ if (e.prioritized === true) firsts[dayNum(e.date)] = true; });
  var best = 0;
  Object.keys(firsts).forEach(function(s){
    var n = Number(s);
    if (firsts[n - 1]) return;
    var len = 0; while (firsts[n + len]) len++;
    if (len > best) best = len;
  });
  var cur = 0, c = firsts[t] ? t : t - 1;
  while (firsts[c]) { cur++; c--; }
  return {
    cur: cur, best: best, doneToday: !!firsts[t],
    checkins: list.filter(isChecked).length,
    finished: list.filter(function(e){ return e.progress === 'done'; }).length,
    total: list.length
  };
}

var OUTCOMES = [
  { id: 'first-done', label: 'I did it first and finished it', first: true,  progress: 'done' },

  { id: 'later-done', label: 'I did it later and finished it', first: false, progress: 'done' },
  { id: 'later-some', label: 'I did it later and made progress', first: false, progress: 'some' },
  { id: 'none',       label: 'I procrastinated and did not work on it', first: false, progress: 'none' }
];
function outcomeOf(e){
  for (var i = 0; i < OUTCOMES.length; i++) if (OUTCOMES[i].first === e.prioritized && OUTCOMES[i].progress === e.progress) return OUTCOMES[i].id;
  return null;
}

var REM_KEY = 'eat-the-frog:reminder';
var IN_CLAUDE = typeof window.claude !== 'undefined';
function remPrefs(){ try { return JSON.parse(localStorage.getItem(REM_KEY)) || {}; } catch (e) { return {}; } }
function setRemPrefs(p){ try { localStorage.setItem(REM_KEY, JSON.stringify(p)); } catch (e) {} }
function remTime(){ var t = remPrefs().time; return /^\d{2}:\d{2}$/.test(t || '') ? t : '08:00'; }
function firstStart(t){
  var hm = t.split(':').map(Number), now = new Date();
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hm[0], hm[1]);
  if (d <= now) d.setDate(d.getDate() + 1);
  return d;
}
function stamp(d){ return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00'; }
var REM_TITLE = 'Eat the Frog: pick your frog';
var REM_TEXT = 'Open the Eat the Frog app, pick your biggest or most dreaded task, and work on it as soon as possible.';
function gcalUrl(t){
  var s0 = firstStart(t), s1 = new Date(s0.getTime() + 10 * 60000), tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(REM_TITLE) +
    '&details=' + encodeURIComponent(REM_TEXT) + '&dates=' + stamp(s0) + '/' + stamp(s1) +
    '&recur=' + encodeURIComponent('RRULE:FREQ=DAILY') + (tz ? '&ctz=' + encodeURIComponent(tz) : '');
}
function icsText(t){
  var s0 = firstStart(t), s1 = new Date(s0.getTime() + 10 * 60000), n = new Date();
  var utc = n.getUTCFullYear() + pad(n.getUTCMonth() + 1) + pad(n.getUTCDate()) + 'T' + pad(n.getUTCHours()) + pad(n.getUTCMinutes()) + pad(n.getUTCSeconds()) + 'Z';
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Eat the Frog//EN', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    'UID:' + Date.now() + '-' + Math.random().toString(36).slice(2) + '@eat-the-frog', 'DTSTAMP:' + utc,
    'DTSTART:' + stamp(s0), 'DTEND:' + stamp(s1), 'RRULE:FREQ=DAILY', 'SUMMARY:' + REM_TITLE,
    'DESCRIPTION:' + REM_TEXT.replace(/,/g, '\\,'), 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Pick your frog', 'TRIGGER:PT0S', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR', ''].join('\r\n');
}
function reminderCard(){
  var t = remTime();
  var h = '<section class="card" aria-labelledby="remH"><h2 id="remH">Set a daily reminder</h2>';
  h += '<p>The app works best with a daily reminder. Set one calendar reminder and your phone will tell you every morning to pick your frog.</p>';
  h += '<div class="field"><label for="remTime">Reminder time</label><input class="input time-input" type="time" id="remTime" value="' + t + '"></div>';
  h += '<div class="row"><a class="btn" id="gcalLink" href="' + esc(gcalUrl(t)) + '" target="_blank" rel="noopener">Add to Google Calendar<span class="sr-only"> (opens in a new tab)</span></a>';
  if (!IN_CLAUDE) h += '<button type="button" class="btn alt" data-action="save-ics">Add to Apple or Outlook calendar</button>';
  h += '</div>';
  h += '<p class="hint">' + (IN_CLAUDE ? 'Use an iPhone or another calendar? ' : 'Prefer not to use a calendar? ') +
    'Open your phone\'s Reminders or Clock app, create a reminder called "Pick my frog" at your time, and set it to repeat every day.</p>';
  return h + '</section>';
}

/* ---------- Backup nudge ---------- */
var BK_KEY = 'eat-the-frog:backup', BK_EVERY = 7;
function bkPrefs(){ try { return JSON.parse(localStorage.getItem(BK_KEY)) || {}; } catch (e) { return {}; } }
function setBk(p){ try { localStorage.setItem(BK_KEY, JSON.stringify(p)); } catch (e) {} }
function sinceBackup(s){ var p = bkPrefs(); return s.checkins - Math.max(p.at || 0, p.snooze || 0); }
function markBackedUp(){ var p = bkPrefs(); p.at = computeStats().checkins; setBk(p); }

/* ---------- Views ---------- */
function doneMessage(e, isToday){
  var later = isToday ? 'See you tomorrow.' : '';
  if (e.prioritized && e.progress === 'done') return 'Frog eaten! ' + later;
  if (e.prioritized) return 'Great start. You tackled it first. ' + later;
  if (e.progress === 'none') return isToday ? 'Tomorrow is a new frog. Try starting it first thing.' : 'You did not get to this one.';
  return 'Nice work getting to it. ' + (isToday ? 'Try doing it first tomorrow.' : '');
}
function streakStrip(s){
  return '<ul class="strip" aria-label="Your progress">' +
    '<li><span class="flame">' + ICON.flame + '</span><span><strong>' + pl(s.cur, 'day') + '</strong> streak</span></li>' +
    '<li>Best: <strong>' + pl(s.best, 'day') + '</strong></li>' +
    '<li>Finished: <strong>' + s.finished + '</strong></li></ul>';
}
function chipsFor(e){
  var h = '';
  if (e.prioritized === false && e.progress === 'none') return '<li class="chip warn">' + ICON.cross + 'Procrastinated</li>';
  if (e.prioritized === true) h += '<li class="chip good">' + ICON.check + 'Did it first</li>';
  else if (e.prioritized === false) h += '<li class="chip">' + ICON.dash + 'Did it later</li>';
  if (e.progress === 'done') h += '<li class="chip good">' + ICON.check + 'Completed</li>';
  else if (e.progress === 'some') h += '<li class="chip">' + ICON.check + 'Made progress</li>';
  else if (e.progress === 'none') h += '<li class="chip">' + ICON.dash + 'No progress</li>';
  if (e.prioritized === null && e.progress === null) h += '<li class="chip">' + ICON.dash + 'Not checked in</li>';
  return h;
}

function viewToday(){
  var tk = todayKey(), key = state.editDate || tk, isToday = key === tk;
  var e = entries[key], s = computeStats();
  var hasFrog = !!(e && e.frog), editing = state.editingFrog || !hasFrog;
  var checked = hasFrog && isChecked(e), open = !editing && state.checkinOpen;
  var h = '<section class="card hero" aria-labelledby="viewHeading">';
  h += '<h1 id="viewHeading" class="hero-date" tabindex="-1">' + (isToday ? '<span class="sr-only">Today, </span>' : '') + esc(fmtDate(key)) + '</h1>';
  if (!isToday) h += '<p><button type="button" class="btn alt small" data-action="back-today">Back to today</button></p>';

  if (editing) {
    h += '<form id="frogForm" novalidate><div class="field">';
    h += '<label for="frogInput">' + (isToday ? 'What is your frog today?' : 'What was your frog on this day?') + '</label>';
    h += '<p class="hint" id="frogHint">Your biggest or most dreaded task. Example: Start my history essay.</p>';
    h += '<input class="input" id="frogInput" name="frog" type="text" maxlength="' + MAX_FROG + '" autocomplete="off" aria-describedby="frogHint frogErr" value="' + esc(e ? e.frog : '') + '">';
    h += '<p class="err" id="frogErr"></p></div>';
    h += '<div class="row"><button type="submit" class="btn">' + (hasFrog ? 'Save frog' : 'Set my frog') + '</button>';
    if (hasFrog) h += '<button type="button" class="btn alt" data-action="cancel-frog">Cancel</button>';
    h += '</div></form>';
  } else {
    h += '<div><h2 id="frogH" class="frog-label" tabindex="-1">' + (isToday ? 'Today\'s frog:' : 'Frog:') + '</h2>';
    h += '<p class="frog-text">' + esc(e.frog) + '</p></div>';
    if (checked) {
      h += '<ul class="chips" id="ciSummary" tabindex="-1" aria-label="Your check-in">' + chipsFor(e) + '</ul>';
      h += '<p class="done-msg">' + doneMessage(e, isToday) + '</p>';
    }
    else if (isToday) h += '<p class="lede">Work on this as soon as possible.</p>';
    h += '<div class="row"><button type="button" class="btn small' + (checked ? ' alt' : '') + '" id="ciToggle" data-action="toggle-checkin" aria-expanded="' + open + '" aria-controls="checkinPanel">' + (checked ? 'Edit check-in' : 'Check in') + '</button>';
    h += '<button type="button" class="btn alt small" data-action="edit-frog">Change frog</button></div>';
  }
  h += streakStrip(s) + '</section>';

  var due = sinceBackup(s);
  if (isToday && !editing && due >= BK_EVERY) {
    h += '<section class="card nudge" aria-labelledby="nudgeH"><h2 id="nudgeH">Back up your journal</h2>';
    h += '<p>You have ' + pl(due, 'check-in') + ' since your last backup. Your journal lives only on this phone, so save a copy now and then.</p>';
    h += '<div class="row"><button type="button" class="btn small" data-action="go-backup">Back up now</button>';
    h += '<button type="button" class="btn alt small" data-action="snooze-backup">Not now</button></div></section>';
  }

  if (!editing) {
    h += '<section class="card" id="checkinPanel" aria-labelledby="ciH"' + (open ? '' : ' hidden') + '><h2 id="ciH" tabindex="-1">Check in</h2>';
    h += '<form id="checkinForm" novalidate>';
    var cur = outcomeOf(e);
    h += '<fieldset id="outcomeSet" aria-describedby="ciErr"><legend>' + (isToday ? 'How did it go with your frog today?' : 'How did it go with your frog?') + '</legend>';
    OUTCOMES.forEach(function(o){
      h += '<label class="opt"><input type="radio" name="outcome" value="' + o.id + '"' + (cur === o.id ? ' checked' : '') + '><span>' + o.label + '</span></label>';
    });
    h += '</fieldset>';
    h += '<div class="field"><label for="noteInput">Anything you want to remember? (optional)</label>';
    h += '<textarea class="input" id="noteInput" name="note" maxlength="' + MAX_NOTE + '">' + esc(e.note || '') + '</textarea></div>';
    h += '<p class="err" id="ciErr"></p>';
    h += '<div class="row"><button type="submit" class="btn">Save check-in</button><button type="button" class="btn alt" data-action="toggle-checkin">Cancel</button></div></form></section>';
  }
  return h;
}

function viewJournal(){
  var keys = Object.keys(entries).sort().reverse();
  var h = '<div><h1 id="viewHeading" tabindex="-1">Journal</h1><p class="lede">' +
    (keys.length ? 'Newest first. ' + pl(keys.length, 'day') + ' saved on this device.' : 'Your saved frogs will appear here.') + '</p></div>';
  if (!keys.length) {
    h += '<div class="card"><p>No entries yet. Pick your first frog on the Today tab.</p><p><button type="button" class="btn small" data-action="nav" data-view="today">Go to Today</button></p></div>';
    return h;
  }
  h += '<ol class="entries">';
  keys.forEach(function(k){
    var e = entries[k], d = fmtDate(k);
    h += '<li class="card entry"><h2 class="entry-date">' + esc(d) + '</h2><p class="entry-frog">' + esc(e.frog) + '</p><ul class="chips">';
    h += chipsFor(e);
    h += '</ul>';
    if (e.note) {
      h += '<button type="button" class="btn alt small" data-action="toggle-note" aria-expanded="false" aria-controls="note-' + k + '">Show notes</button>' +
        '<p class="note" id="note-' + k + '" hidden>' + esc(e.note) + '</p>';
    }
    h += '</li>';
  });
  h += '</ol>';
  return h;
}

function viewBadges(){
  var s = computeStats(), list = badgeStatus(s), n = list.filter(function(x){ return x.earned; }).length;
  var h = '<div><h1 id="viewHeading" tabindex="-1">Badges</h1><p class="lede">You have earned ' + n + ' of ' + list.length + ' badges. Streak badges count your best streak, so you keep them.</p></div>';
  h += '<ul class="badges">';
  list.forEach(function(x){
    var b = x.b, v = Math.min(x.value, b.goal);
    h += '<li class="card badge' + (x.earned ? '' : ' locked') + '">' + medal(b, x.earned) + '<div><h2>' + esc(b.name) + '</h2>' +
      '<p>' + esc(b.desc) + '</p><p class="state">' + (x.earned ? 'Earned' : 'Locked: ' + v + ' of ' + b.goal + ' ' + b.unit + (b.goal === 1 ? '' : 's')) + '</p>' +
      (x.earned ? '' : '<progress value="' + v + '" max="' + b.goal + '" aria-label="Progress toward ' + esc(b.name) + '">' + v + ' of ' + b.goal + '</progress>') + '</div></li>';
  });
  h += '</ul>';
  return h;
}

function backupText(){
  return JSON.stringify({ app: 'eat-the-frog', version: 1, exported: new Date().toISOString(), entries: entries });
}

function viewHelp(){
  var h = '<div><h1 id="viewHeading" tabindex="-1">Help</h1><p class="lede">How the app works and how to keep your journal safe.</p></div>';
  h += '<section class="card" aria-labelledby="howH"><h2 id="howH">How it works</h2><ol class="steps">' +
    '<li><strong>Pick your frog.</strong> Each morning, choose your biggest or most dreaded task.</li>' +
    '<li><strong>Work on it as soon as possible.</strong> Start your frog before your other tasks.</li>' +
    '<li><strong>Check in.</strong> Choose the answer that best describes how it went.</li></ol></section>';
  h += reminderCard();
  h += '<section class="card" aria-labelledby="streakHelpH"><h2 id="streakHelpH">How streaks work</h2>' +
    '<p>Your streak grows each day you check in and choose one of the "I did it first" answers If you miss a day, the streak starts over. Today never breaks your streak until the day is over. Badges you have earned stay earned.</p></section>';
  h += '<section class="card" aria-labelledby="dataH"><h2 id="dataH">Where your data lives</h2>' +
    '<p>Your entries are saved in this browser on this device. There are no accounts and your entries are never sent anywhere. The Google Calendar button only sends the reminder title and time to Google, and only when you tap it. Clearing your browser data, or using a different phone or browser, means your journal will not be there. Make a backup to move or protect it.</p></section>';
  h += '<section class="card" aria-labelledby="backupH"><h2 id="backupH" tabindex="-1">Back up your journal</h2>' +
    '<div class="field"><label for="backupBox">Backup text</label><p class="hint" id="backupHint">Copy this text and keep it somewhere safe, such as a note to yourself.</p>' +
    '<textarea class="input backup" id="backupBox" readonly aria-describedby="backupHint" rows="4"></textarea></div>' +
    '<div><button type="button" class="btn" data-action="copy-backup">Copy backup text</button></div></section>';
  h += '<section class="card" aria-labelledby="restoreH"><h2 id="restoreH">Restore from a backup</h2>' +
    '<form id="restoreForm" novalidate><div class="field"><label for="restoreBox">Paste your backup text</label>' +
    '<p class="hint" id="restoreHint">Restoring adds missing days and keeps the newest version of days you already have.</p>' +
    '<textarea class="input backup" id="restoreBox" rows="4" aria-describedby="restoreHint restoreErr"></textarea><p class="err" id="restoreErr"></p></div>' +
    '<div><button type="submit" class="btn alt">Restore</button></div></form></section>';
  return h;
}

/* ---------- Render ---------- */
var TITLES = { today: 'Today', journal: 'Journal', badges: 'Badges', help: 'Help' };
function render(focusSel){
  renderedDay = todayKey();
  var app = $('#app');
  var fn = { today: viewToday, journal: viewJournal, badges: viewBadges, help: viewHelp }[state.view];
  app.innerHTML = fn();
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
    if (t.dataset.view === state.view) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  $('#storageNote').hidden = storageOk;
  var te = entries[todayKey()];
  document.querySelector('.band').classList.toggle('eaten', !!(te && te.prioritized === true));
  document.title = TITLES[state.view] + ' - ' + BRAND.appName;
  if (state.view === 'help') { var bb = $('#backupBox'); if (bb) bb.value = backupText(); }
  if (focusSel) { var el = $(focusSel); if (el) el.focus(); }
}

/* ---------- Actions ---------- */
function go(view){
  state.view = view; state.confirmDelete = null; state.checkinOpen = false;
  if (view !== 'today') { state.editDate = null; state.editingFrog = false; }
  render('#viewHeading');
}

document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-action]');
  if (!t) return;
  setStatus('');
  var a = t.dataset.action, d = t.dataset.date;
  if (a === 'nav') { setStatus(''); if (t.dataset.view === 'today') { state.editDate = null; state.editingFrog = false; } go(t.dataset.view); }
  else if (a === 'edit-frog') { state.editingFrog = true; state.checkinOpen = false; render('#frogInput'); }
  else if (a === 'cancel-frog') { state.editingFrog = false; render('#frogH'); }
  else if (a === 'back-today') { state.editDate = null; state.editingFrog = false; render('#viewHeading'); }
  else if (a === 'save-ics') {
    if (IN_CLAUDE) { setStatus('Calendar files cannot be saved from this page. Use the Google Calendar button or your phone\'s Reminders app.'); return; }
    var url = URL.createObjectURL(new Blob([icsText(remTime())], { type: 'text/calendar' }));
    var link = document.createElement('a'); link.href = url; link.download = 'eat-the-frog-reminder.ics';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    setStatus('Calendar file created. Open it and choose Add to add the daily reminder.');
  }
  else if (a === 'go-backup') {
    state.view = 'help'; state.checkinOpen = false;
    render('#backupH');
    var bh = $('#backupH'); if (bh) bh.scrollIntoView({ block: 'start' });
  }
  else if (a === 'snooze-backup') {
    var bp = bkPrefs(); bp.snooze = computeStats().checkins; setBk(bp);
    render('#viewHeading');
    setStatus('Okay. You will see this again after ' + BK_EVERY + ' more check-ins. Help always has the backup.');
  }
  else if (a === 'toggle-checkin') {
    state.checkinOpen = !state.checkinOpen;
    var panel = $('#checkinPanel'), tg = $('#ciToggle');
    panel.hidden = !state.checkinOpen;
    tg.setAttribute('aria-expanded', String(state.checkinOpen));
    if (state.checkinOpen) { var hd = $('#ciH'); hd.focus(); hd.scrollIntoView({ block: 'start', behavior: 'auto' }); }
    else tg.focus();
  }
  else if (a === 'toggle-note') {
    var note = document.getElementById(t.getAttribute('aria-controls'));
    var open = t.getAttribute('aria-expanded') !== 'true';
    t.setAttribute('aria-expanded', String(open));
    t.textContent = open ? 'Hide notes' : 'Show notes';
    note.hidden = !open;
  }
  else if (a === 'copy-backup') {
    var box = $('#backupBox'), txt = box.value;
    var fallback = function(){ markBackedUp(); box.focus(); box.select(); setStatus('The backup text is selected. Use your device\'s copy command to copy it, then paste it somewhere safe.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ markBackedUp(); setStatus('Backup text copied. Paste it somewhere safe, such as an email or note to yourself.'); }, fallback);
    else fallback();
  }
});

document.addEventListener('submit', function(ev){
  ev.preventDefault();
  setStatus('');
  var f = ev.target;
  if (f.id === 'frogForm') submitFrog(f);
  else if (f.id === 'checkinForm') submitCheckin(f);
  else if (f.id === 'restoreForm') submitRestore(f);
});

function submitFrog(f){
  var inp = $('#frogInput'), v = inp.value.trim(), key = state.editDate || todayKey();
  if (!v) {
    inp.setAttribute('aria-invalid', 'true');
    showErr('frogErr', 'Error: Enter your frog before saving. Example: Start my history essay.');
    inp.focus(); return;
  }
  var old = entries[key];
  entries[key] = { date: key, frog: v.slice(0, MAX_FROG), prioritized: old ? old.prioritized : null, progress: old ? old.progress : null, note: old ? old.note : '', updated: Date.now() };
  var ok = save();
  state.editingFrog = false;
  render('#frogH');
  var msg = old && isChecked(old) ? 'Frog renamed. Your check-in is kept.' : (old ? 'Frog updated.' : 'Frog saved.') + ' Work on it as soon as possible, then tap Check in.';
  setStatus(msg + (ok ? '' : ' This browser is not saving data, so copy your backup from Help.'));
}

function submitCheckin(f){
  var key = state.editDate || todayKey(), e = entries[key];
  var pick = f.elements['outcome'].value, note = f.elements['note'].value.slice(0, MAX_NOTE);
  var o = OUTCOMES.filter(function(x){ return x.id === pick; })[0];
  if (!o) {
    showErr('ciErr', 'Error: Choose the answer that best describes how it went.');
    f.querySelector('input[name="outcome"]').focus(); return;
  }
  var before = badgeStatus(computeStats()).filter(function(x){ return x.earned; }).map(function(x){ return x.b.id; });
  e.prioritized = o.first; e.progress = o.progress; e.note = note; e.updated = Date.now();
  var ok = save();
  var after = badgeStatus(computeStats()).filter(function(x){ return x.earned && before.indexOf(x.b.id) < 0; });
  var s = computeStats();
  state.checkinOpen = false;
  render('#ciSummary');
  var msg = 'Check-in saved.';
  if (e.prioritized && key === todayKey()) msg += ' Your streak is ' + pl(s.cur, 'day') + '.';
  if (after.length) msg += ' New badge' + (after.length > 1 ? 's' : '') + ' earned: ' + after.map(function(x){ return x.b.name; }).join(', ') + '. See the Badges tab.';
  if (!ok) msg += ' This browser is not saving data, so copy your backup from Help.';
  setStatus(msg);
}

function submitRestore(f){
  var box = $('#restoreBox'), txt = box.value.trim();
  function fail(m){ box.setAttribute('aria-invalid', 'true'); showErr('restoreErr', 'Error: ' + m); box.focus(); }
  if (!txt) return fail('Paste your backup text first.');
  var data;
  try { data = JSON.parse(txt); } catch (e) { return fail('That text is not a valid backup. Copy the whole backup text and try again.'); }
  if (!data || data.app !== 'eat-the-frog' || typeof data.entries !== 'object') return fail('That text is not an Eat the Frog backup.');
  var incoming = cleanAll(data.entries), added = 0, updated = 0;
  Object.keys(incoming).forEach(function(k){
    var cur = entries[k];
    if (!cur) { entries[k] = incoming[k]; added++; }
    else if (incoming[k].updated > cur.updated) { entries[k] = incoming[k]; updated++; }
  });
  var ok = save();
  markBackedUp();
  render('#viewHeading');
  setStatus('Restore finished. ' + pl(added, 'day') + ' added, ' + pl(updated, 'day') + ' updated.' + (ok ? '' : ' This browser is not saving data, so copy your backup from Help.'));
}

document.addEventListener('input', function(ev){
  if (ev.target.id !== 'remTime' || !/^\d{2}:\d{2}$/.test(ev.target.value)) return;
  var p = remPrefs(); p.time = ev.target.value; setRemPrefs(p);
  var g = $('#gcalLink'); if (g) g.href = gcalUrl(ev.target.value);
});

document.addEventListener('visibilitychange', function(){
  if (!document.hidden && todayKey() !== renderedDay && state.view === 'today') render();
});

/* ---------- Boot ---------- */
(function brand(){
  $('#appName').textContent = BRAND.headerText || BRAND.appName;
  if (BRAND.orgName) { var o = $('#orgName'); o.textContent = BRAND.orgName; o.hidden = false; }
  if (BRAND.logoSrc) { var l = $('#logo'); l.src = BRAND.logoSrc; l.alt = BRAND.logoAlt || ''; $('#scene').hidden = false; document.querySelector('.band').classList.add('has-logo'); }
})();
render();
})();
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
